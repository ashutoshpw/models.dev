base_model = "openai/gpt-realtime-2.1"
name = "gpt-realtime-2.1"
description = "Speech generation model for controllable voice, narration, and audio delivery"
attachment = false
temperature = true
tool_call = false

[[reasoning_options]]
type = "effort"
values = ["minimal", "low", "medium", "high", "xhigh"]

[cost]
input = 4
output = 24
cache_read = 0.4

[modalities]
input = ["text", "audio"]

# Vercel AI Gateway disables tool calling for this realtime model
# (tool_call = false above). Explicit unknown refuses the canonical claim.
[capabilities.features.tool_calling]
status = "unknown"
