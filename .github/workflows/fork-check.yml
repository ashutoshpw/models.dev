name: Fork check

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  fork:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Check fork deployment invariants
        run: bun scripts/check-fork.ts --tree
